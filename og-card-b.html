<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:radial-gradient(700px 380px at 78% 0%, rgba(233,138,60,.15), transparent 62%), #FDF6EC;
  font-family:"Zen Kaku Gothic New",sans-serif;color:#4C3B2A;
  display:flex;flex-direction:column;
}
.top{height:152px;flex-shrink:0;padding:0 52px;display:flex;align-items:center;gap:26px}
.tl{flex:1;min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:#E07B39;background:#FBEADB;
  border:1.5px solid rgba(224,123,57,.4);border-radius:999px;padding:4px 13px;margin-bottom:9px;
}
h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:44px;line-height:1.2;color:#3D2C1D;white-space:nowrap}
h1 em{font-style:normal;color:#E8542F}
.title{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:21px;color:#8B5E3C;margin-top:8px}
.by{display:flex;align-items:center;gap:12px;flex-shrink:0;padding-top:6px}
.by img{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid #E07B39}
.by .n{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:20px;line-height:1.3;white-space:nowrap}
.by .r{font-size:13.5px;color:#8B7A66;line-height:1.4;white-space:nowrap}
.scene{flex:1;background:url("img/hanaichi.jpg") center 16% / 100% auto no-repeat}
</style>
</head>
<body>
  <div class="top">
    <div class="tl">
      <span class="eyebrow">💮 3分でわかる・無料</span>
      <h1>あの頃、あなたは<em>何を見てた？</em></h1>
      <p class="title">はないちもんめセラピー</p>
    </div>
    <div class="by">
      <img src="hanako-avatar.jpg" alt="">
      <div>
        <p class="n">小泉華子</p>
        <p class="r">思考の学校 上級認定講師</p>
      </div>
    </div>
  </div>
  <div class="scene"></div>
</body>
</html>
